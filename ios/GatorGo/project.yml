name: GatorGo
options:
  bundleIdPrefix: edu.sfsu
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.15.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.0.0
targets:
  GatorGo:
    type: application
    platform: iOS
    sources:
      - path: GatorGo
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.sfsu.gatorgo
        CODE_SIGN_ENTITLEMENTS: GatorGo/GatorGo.entitlements
        INFOPLIST_FILE: GatorGo/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleMaps
        product: GoogleMaps
schemes:
  GatorGo:
    build:
      targets:
        GatorGo: all
    run:
      config: Debug
    archive:
      config: Release
